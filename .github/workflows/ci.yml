name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned (not ubuntu-latest): the distro wine package version is fixed per Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run module tests
        run: ./gradlew :corral-common:test :corral-update:test :corral-daemon:test :corral-ui:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            corral-common/build/reports/tests/test/
            corral-daemon/build/reports/tests/test/
            corral-ui/build/reports/tests/test/
            corral-common/build/test-results/test/
            corral-daemon/build/test-results/test/
            corral-ui/build/test-results/test/
          retention-days: 7

      - name: Install and initialise wine (Windows .bat wrapper checks)
        env:
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          # WineHQ, NOT Ubuntu's `wine` package (9.0). Ubuntu's build does not propagate a batch
          # file's exit code across `call`, so four wrapper checks asserting the delegate's exit
          # code saw 1 instead -- the delegate ran, its output appeared, only the status was wrong.
          # Real cmd.exe propagates correctly (the winbox confirms WRAPPER_EXIT=3), so pinning a
          # faithful emulator keeps those assertions instead of weakening them.
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -q -NP /etc/apt/sources.list.d/ \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-stable
          wine --version
          # fail loudly if the wrong wine won: Ubuntu's 9.0 is the broken one, WineHQ's 10+ is fine
          wine --version | grep -qE 'wine-[1-9][0-9]+\.' || {
            echo "::error::expected a WineHQ build (>= 10, not Ubuntu 9.0's)"; exit 1; }
          command -v wineboot >/dev/null || { echo "::error::wineboot missing"; exit 1; }
          wineboot -i

      - name: Run wrapper integration suite
        run: bash scripts/test_wrapper.sh

      - name: Build runnable jar
        run: ./gradlew :corral-daemon:shadowJar

      - name: Build ui jar
        run: ./gradlew :corral-ui:shadowJar

      - name: Daemon e2e suite
        run: SLOW=1 bash scripts/test_e2e.sh

      - name: Install sandbox suite
        run: bash scripts/test_install.sh

      - name: Mirror and verify installer bundle
        run: bash scripts/make-installer.sh

      - name: Installer bundle drift check
        run: bash scripts/make-installer.sh --check
