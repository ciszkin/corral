name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned (not ubuntu-latest): the distro wine package version is fixed per Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run module tests
        run: ./gradlew :corral-common:test :corral-daemon:test :corral-ui:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            corral-common/build/reports/tests/test/
            corral-daemon/build/reports/tests/test/
            corral-ui/build/reports/tests/test/
            corral-common/build/test-results/test/
            corral-daemon/build/test-results/test/
            corral-ui/build/test-results/test/
          retention-days: 7

      - name: Install and initialise wine (Windows .bat wrapper checks)
        env:
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine
          wine --version
          wineboot -i

      - name: Run wrapper integration suite
        run: bash scripts/test_wrapper.sh

      - name: Build runnable jar
        run: ./gradlew :corral-daemon:shadowJar

      - name: Build ui jar
        run: ./gradlew :corral-ui:shadowJar

      - name: Daemon e2e suite
        run: SLOW=1 bash scripts/test_e2e.sh

      - name: Install sandbox suite
        run: bash scripts/test_install.sh

      - name: Mirror and verify installer bundle
        run: bash scripts/make-installer.sh

      - name: Installer bundle drift check
        run: bash scripts/make-installer.sh --check
