name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run daemon tests
        run: ./gradlew :corral-daemon:test

      - name: Run wrapper integration suite
        run: bash scripts/test_wrapper.sh

      - name: Build runnable jar
        run: ./gradlew :corral-daemon:shadowJar

      - name: Wrapper integration suite
        run: bash scripts/test_wrapper.sh

      - name: Daemon e2e suite
        run: SLOW=1 bash scripts/test_e2e.sh

      - name: Install sandbox suite
        run: bash scripts/test_install.sh

      - name: Mirror and verify installer bundle
        run: bash scripts/make-installer.sh

      - name: Installer bundle drift check
        run: bash scripts/make-installer.sh --check
